name: Test multiple URLs audit
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Chrome
        run: |
          # Check for existing Chrome installations
          CHROME=$(which google-chrome-stable 2>/dev/null \
            || which google-chrome 2>/dev/null \
            || which chromium 2>/dev/null \
            || which chromium-browser 2>/dev/null \
            || true)

          if [ -z "$CHROME" ]; then
            echo "No Chrome found, installing google-chrome-stable from Google..."
            curl -fsSL https://dl.google.com/linux/linux_signing_key.pub \
              | gpg --dearmor -o /usr/share/keyrings/google-chrome.gpg
            echo "deb [arch=amd64 signed-by=/usr/share/keyrings/google-chrome.gpg] http://dl.google.com/linux/chrome/deb/ stable main" \
              > /etc/apt/sources.list.d/google-chrome.list
            apt-get update -qq
            apt-get install -y -qq google-chrome-stable
            CHROME=$(which google-chrome-stable 2>/dev/null || which google-chrome 2>/dev/null || true)
          fi

          if [ -z "$CHROME" ]; then
            echo "ERROR: Chrome could not be found or installed"
            exit 1
          fi

          echo "Using Chrome at: $CHROME"
          echo "CHROME_PATH=$CHROME" >> $GITHUB_ENV
          "$CHROME" --version || true

      - id: lhci
        uses: .
        with:
          configPath: ${{ github.workspace }}/tests/fixtures/lighthouserc-multi.json

      - name: Assert resultsPath is set
        env:
          RESULTS_PATH: ${{ steps.lhci.outputs.resultsPath }}
        run: |
          echo "resultsPath: $RESULTS_PATH"
          if [ -z "$RESULTS_PATH" ]; then
            echo "FAIL: resultsPath output is empty"
            exit 1
          fi
          echo "PASS: resultsPath is set to $RESULTS_PATH"

      - name: Assert multiple LHR files were generated
        env:
          RESULTS_PATH: ${{ steps.lhci.outputs.resultsPath }}
        run: |
          echo "Checking directory: $RESULTS_PATH"
          if [ ! -d "$RESULTS_PATH" ]; then
            echo "FAIL: resultsPath directory does not exist"
            exit 1
          fi
          # With 2 runs, we expect at least 2 LHR files
          LHR_COUNT=$(find "$RESULTS_PATH" -name "lhr-*.json" | wc -l)
          echo "Found $LHR_COUNT LHR files"
          if [ "$LHR_COUNT" -lt 2 ]; then
            echo "FAIL: expected at least 2 LHR files, found $LHR_COUNT"
            ls -la "$RESULTS_PATH"
            exit 1
          fi
          echo "PASS: found $LHR_COUNT LHR files"
